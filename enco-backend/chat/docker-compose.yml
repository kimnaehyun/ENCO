services:
  # ===== MongoDB =====
  chat-mongo:
    image: mongo:7.0
    container_name: chat-mongo
    restart: unless-stopped
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_INITDB_ROOT_USERNAME}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_INITDB_ROOT_PASSWORD}
      MONGO_INITDB_DATABASE: ${CHAT_DB_NAME}
    volumes:
      - chat-mongo-data:/data/db
      - ./mongo-init/init-mongo.js:/docker-entrypoint-initdb.d/init-mongo.js:ro
    networks:
      - chat-network

  # ===== Mongo Express (웹 GUI - 개발용) =====
  mongo-express:
    image: mongo-express:latest
    container_name: chat-mongo-express
    restart: unless-stopped
    ports:
      - "8081:8081"
    environment:
      ME_CONFIG_MONGODB_ADMINUSERNAME: ${MONGO_INITDB_ROOT_USERNAME}
      ME_CONFIG_MONGODB_ADMINPASSWORD: ${MONGO_INITDB_ROOT_PASSWORD}
      ME_CONFIG_MONGODB_URL: mongodb://${MONGO_INITDB_ROOT_USERNAME}:${MONGO_INITDB_ROOT_PASSWORD}@chat-mongo:27017/
      ME_CONFIG_BASICAUTH: false
    depends_on:
      - chat-mongo
    networks:
      - chat-network

volumes:
  chat-mongo-data:

networks:
  chat-network:
    driver: bridge
