spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      server:
        webflux:
          globalcors:
            cors-configurations:
              '[/**]':
                allowedOrigins:
                  - 'http://localhost:3000'
                  - 'http://localhost:5500'
                  - 'https://ssafywte.site'
                  - 'http://ssafywte.site'
                allowedMethods: '*'
                allowedHeaders: '*'
#                allowedCredentials: true
          routes:


            - id: auth-service-public
              uri: http://${AUTH_SERVICE_HOST}:${AUTH_SERVICE_PORT}
              predicates:
                - Path=/auth-service/api/v1/auth/signup, /auth-service/api/v1/auth/login, /auth-service/api/v1/auth/regist, /auth-service/api/v1/auth/re-login
              filters:
                - StripPrefix=1

            - id: auth-service-private
              uri: http://${AUTH_SERVICE_HOST}:${AUTH_SERVICE_PORT}
              predicates:
                - Path=/auth-service/api/**
              filters:
                - StripPrefix=1
                - AuthorizationHeaderFilter

            - id: auth-service-internal
              uri: http://${AUTH_SERVICE_HOST}:${AUTH_SERVICE_PORT}
              predicates:
                - Path=/auth-service/internal/**
              filters:
                - StripPrefix=1

            - id: payment-service-public
              uri: http://${PAYMENT_SERVICE_HOST}:${PAYMENT_SERVICE_PORT}
              predicates:
                - Path=/payment-service/api/v1/ai/receipt/parse, /payment-service/api/v1/files/image/**, /payment-service/api/v1/payments/pay
              filters:
                - StripPrefix=1

            - id: payment-service
              uri: http://${PAYMENT_SERVICE_HOST}:${PAYMENT_SERVICE_PORT}
              predicates:
                - Path=/payment-service/api/**
              filters:
                - StripPrefix=1
                - name : AuthorizationHeaderFilter

            - id: chat-service-sse
              uri: http://${CHAT_SERVICE_HOST}:${CHAT_SERVICE_PORT}
              predicates:
                - Path=/chat-service/api/v1/notifications/subscribe
              filters:
                - StripPrefix=1
                - AuthorizationHeaderFilter
              metadata:
                response-timeout: -1
                connect-timeout: 5000

            - id: chat-service
              uri: http://${CHAT_SERVICE_HOST}:${CHAT_SERVICE_PORT}
              predicates:
                - Path=/chat-service/api/**
              filters:
                - StripPrefix=1
                - AuthorizationHeaderFilter

            - id: chat-websocket
              uri: ws://${CHAT_SERVICE_HOST}:${CHAT_SERVICE_PORT}
              predicates:
                - Path=/ws-stomp/**
                
            - id: travel-service-public
              uri: http://${TRAVEL_SERVICE_HOST}:${TRAVEL_SERVICE_PORT}
              predicates:
                - Path=/travel-service/api/v1/products/**, /travel-service/images/**
              filters:
                - StripPrefix=1

            - id: travel-service
              uri: http://${TRAVEL_SERVICE_HOST}:${TRAVEL_SERVICE_PORT}
              predicates:
                - Path=/travel-service/api/**
              filters:
                - StripPrefix=1
                - AuthorizationHeaderFilter


jwt:
  secret: ${JWT_SECRET}
server:
  port: 8081